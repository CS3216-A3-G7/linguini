<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Linguini launch film</title>
<style>
@font-face { font-family: "Baloo 2"; src: url("assets/fonts/Baloo2-ExtraBold.ttf"); font-weight: 800; }
@font-face { font-family: "Baloo 2"; src: url("assets/fonts/Baloo2-Bold.ttf"); font-weight: 700; }
@font-face { font-family: "Nunito Sans"; src: url("assets/fonts/NunitoSans-600.ttf"); font-weight: 600; }
@font-face { font-family: "Nunito Sans"; src: url("assets/fonts/NunitoSans-Bold.ttf"); font-weight: 700; }
@font-face { font-family: "Nunito Sans"; src: url("assets/fonts/NunitoSans-800.ttf"); font-weight: 800; }

:root {
  --tomato: #ef5b32; --tomato-deep: #c84725; --pasta: #f9ae22; --pasta-soft: #fde6b4;
  --butter: #fbf8ef; --cream: #fff2d6; --paper: #fffdf8; --sage: #dcebdd;
  --teal: #2e9c99; --teal-dark: #21716f; --teal-deep: #184f4e; --ink: #263238; --muted: #5d6c70;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: #000; }
#stage {
  position: relative; width: 1920px; height: 1080px; overflow: hidden;
  background: var(--butter); font-family: "Nunito Sans", sans-serif; color: var(--ink);
}
.scene { position: absolute; inset: 0; overflow: hidden; visibility: hidden; }
.abs { position: absolute; }
.center { left: 50%; top: 50%; }
img { display: block; }
.display { font-family: "Baloo 2", sans-serif; font-weight: 800; line-height: 0.95; letter-spacing: -0.02em; }

/* Curtain */
#curtain { background: radial-gradient(ellipse 60% 70% at 50% 58%, #fffaf0 0%, #f6ecd4 55%, #e9d9b3 100%); }
.floor { left: 0; right: 0; bottom: 0; height: 240px; background: linear-gradient(#e6d2a6, #d9c08e); }
.spot { left: 50%; top: -200px; width: 1100px; height: 1400px; margin-left: -550px;
  background: radial-gradient(ellipse 50% 60% at 50% 60%, rgba(255,250,235,.9), rgba(255,250,235,0) 70%); }
.drape { top: -20px; width: 1010px; height: 1120px;
  background:
    repeating-linear-gradient(90deg, rgba(0,0,0,.28) 0 6px, rgba(0,0,0,0) 40px, rgba(255,255,255,.12) 62px, rgba(0,0,0,0) 84px, rgba(0,0,0,.28) 124px),
    linear-gradient(#d8401d, #b3311a 80%, #8e2512);
  box-shadow: inset 0 -40px 60px rgba(0,0,0,.25); }
#drapeL { left: -40px; transform-origin: left top; border-bottom-right-radius: 120px 30px; }
#drapeR { right: -40px; transform-origin: right top; border-bottom-left-radius: 120px 30px; }
.valance { left: -20px; right: -20px; top: -10px; height: 150px;
  background:
    radial-gradient(circle at 60px -40px, transparent 118px, #9d2a14 119px, #b93419 150px, transparent 151px) 0 0 / 120px 150px repeat-x;
  filter: drop-shadow(0 10px 18px rgba(0,0,0,.35)); }
.valance::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 64px; background: linear-gradient(#b3311a, #9d2a14); }
.tassel { width: 22px; height: 110px; border-radius: 11px; background: linear-gradient(#ffd26b, #e2a228); top: 600px; box-shadow: 0 6px 12px rgba(0,0,0,.3); }

/* Old way */
#old { background: var(--cream); }
.flash { width: 780px; height: 450px; border-radius: 26px; background: var(--paper);
  box-shadow: 0 30px 60px -20px rgba(80,55,20,.35), 0 0 0 2px rgba(80,55,20,.06);
  display: grid; place-items: center; }
.flash span { font-family: "Baloo 2"; font-weight: 800; font-size: 104px; color: #9aa5a8; text-decoration: line-through; text-decoration-color: rgba(239,91,50,.55); text-decoration-thickness: 6px; }
.gauge { width: 520px; height: 300px; }
.bigText { font-size: 150px; }
.midText { font-size: 110px; }

/* Idea */
#idea { background: #1b2427; color: #fff8ea; }
#flashWhite { inset: 0; background: #fff; opacity: 0; }

/* Photo scenes */
.photo { position: absolute; left: 50%; top: 50%; transform-origin: 50% 50%; }
.photo > img { width: 100%; height: 100%; object-fit: cover; }
.scrim { left: 0; right: 0; bottom: 0; height: 560px; background: linear-gradient(rgba(10,15,17,0), rgba(10,15,17,.55) 55%, rgba(10,15,17,.8)); }
.scrimTop { left: 0; right: 0; top: 0; height: 360px; background: linear-gradient(rgba(10,15,17,.45), rgba(10,15,17,0)); }
.marker { position: absolute; display: flex; align-items: center; gap: 12px; transform-origin: 30px 50%; }
.dot { width: 64px; height: 64px; border-radius: 50%; border: 4px solid var(--ink); background: var(--paper);
  display: grid; place-items: center; font-weight: 800; font-size: 30px; box-shadow: 0 8px 20px rgba(0,0,0,.35); flex: none; }
.dot.on { background: var(--pasta); }
.label { padding: 10px 22px; border-radius: 18px; background: rgba(38,50,56,.9); color: #fff; font-weight: 800; font-size: 40px; white-space: nowrap; }
.chip { position: absolute; padding: 16px 30px 18px; border-radius: 24px; background: var(--paper); box-shadow: 0 16px 40px rgba(0,0,0,.35);
  font-family: "Baloo 2"; font-weight: 800; font-size: 64px; color: var(--teal-dark); white-space: nowrap; transform-origin: 50% 100%; }
.chip small { display: block; font-family: "Nunito Sans"; font-size: 26px; font-weight: 700; color: var(--muted); margin-top: -4px; }
.chip::after { content: ""; position: absolute; left: 50%; bottom: -12px; width: 26px; height: 26px; background: var(--paper); transform: translateX(-50%) rotate(45deg); }
.scan { left: 0; right: 0; height: 260px; background: linear-gradient(rgba(46,156,153,0), rgba(46,156,153,.35) 80%, rgba(255,253,248,.95) 100%); mix-blend-mode: screen; }
.slam { color: #fff; text-shadow: 0 6px 30px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.35); font-size: 190px; }
.miniGauge { right: 70px; top: 70px; width: 340px; padding: 22px 26px 18px; border-radius: 28px; background: rgba(255,253,248,.95); box-shadow: 0 20px 50px rgba(0,0,0,.3); }
.miniGauge p { margin: 0 0 4px; font-weight: 800; font-size: 26px; color: var(--muted); }

/* Play */
#play { background: var(--sage); }
.card { width: 720px; padding: 44px 52px 48px; border-radius: 44px; background: var(--cream); box-shadow: 0 40px 80px -30px rgba(40,60,50,.45); }
.card .lbl { font-weight: 800; font-size: 30px; color: var(--muted); }
.card .word { font-family: "Baloo 2"; font-weight: 800; font-size: 120px; color: var(--teal-dark); line-height: 1; margin-top: 18px; }
.card .mean { font-size: 40px; color: var(--muted); margin-top: 10px; }
.card .ipa { font-size: 30px; color: var(--muted); margin-top: 6px; }
.speak { position: absolute; right: 44px; top: 36px; width: 96px; height: 96px; border-radius: 50%; background: var(--paper); box-shadow: 0 8px 20px rgba(0,0,0,.14); display: grid; place-items: center; color: var(--teal-dark); }
.says { width: 760px; padding: 36px 44px 40px; border-radius: 40px; background: var(--paper); box-shadow: 0 40px 80px -30px rgba(40,60,50,.45); }
.says .who { display: flex; align-items: center; gap: 16px; font-weight: 800; font-size: 28px; color: var(--muted); }
.says .clue { font-family: "Baloo 2"; font-weight: 800; font-size: 58px; line-height: 1.12; margin: 18px 0 26px; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.choice { height: 100px; border-radius: 26px; display: grid; place-items: center; font-weight: 800; font-size: 38px; box-shadow: inset 0 0 0 3px #e4dccb; background: var(--butter); }
.choice.ok { background: #e3f2ef; box-shadow: inset 0 0 0 5px var(--teal); color: var(--teal-deep); }
.xp { padding: 16px 34px; border-radius: 999px; background: var(--teal); color: #fff; font-weight: 800; font-size: 52px; box-shadow: 0 16px 30px rgba(20,30,30,.22); }
.streak { display: flex; gap: 22px; padding: 26px 34px; border-radius: 34px; background: var(--paper); box-shadow: 0 30px 60px -24px rgba(40,60,50,.4); }
.day { width: 92px; height: 110px; display: grid; justify-items: center; align-content: end; gap: 8px; font-weight: 800; font-size: 26px; color: var(--muted); }
.day .slot { width: 84px; height: 66px; display: grid; place-items: center; }
.day .ring { width: 40px; height: 40px; border-radius: 50%; box-shadow: inset 0 0 0 4px #d9d0bd; }
.pasta { position: absolute; filter: drop-shadow(0 18px 18px rgba(60,40,0,.25)); }

/* Journal */
#journal { background: var(--butter); }
.jcard { position: absolute; width: 520px; padding: 16px 16px 20px; border-radius: 26px; background: var(--paper);
  box-shadow: 0 30px 60px -24px rgba(62,45,18,.45), 0 0 0 2px rgba(86,67,34,.06); }
.jgrid { display: grid; grid-template-columns: 2fr 1fr; grid-template-rows: 1fr 1fr; gap: 6px; height: 300px; border-radius: 16px; overflow: hidden; }
.jgrid img { width: 100%; height: 100%; object-fit: cover; }
.jgrid .main { grid-row: 1 / -1; }
.jtitle { font-weight: 800; font-size: 32px; margin: 16px 6px 6px; }
.jbody { font-size: 26px; line-height: 1.45; color: #3d4b51; margin: 0 6px; }
.jbody mark { background: var(--pasta-soft); color: inherit; border-radius: 6px; padding: 0 4px; font-weight: 800; }
.jdate { font-size: 22px; font-weight: 700; color: var(--muted); border-top: 2px solid #e4dccb; margin: 14px 6px 0; padding-top: 12px; }

/* Reveal */
#reveal { background: var(--butter); }
.tag { font-size: 64px; font-weight: 800; }
.pill { padding: 22px 44px; border-radius: 999px; background: var(--ink); color: #fff8ea; font-weight: 800; font-size: 40px; display: flex; gap: 18px; align-items: center; white-space: nowrap; }
.pill b { color: var(--pasta); }
.ph { width: 54px; height: 54px; border-radius: 50%; background: #da552f; display: grid; place-items: center; color: #fff; font-family: "Baloo 2"; font-weight: 800; font-size: 34px; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="film.js"></script>
</body>
</html>
